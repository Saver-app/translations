name: New language
description: Ask for a language Saver does not speak yet, or offer to translate it.
labels: [new language]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Polish (pl)
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I am a native or fluent speaker and can translate or review it
  - type: textarea
    id: notes
    attributes:
      label: Anything else
